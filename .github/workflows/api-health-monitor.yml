name: Leak Alert API Health Monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check API availability
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          LEAK_ALERT_USERNAME: ${{ secrets.LEAK_ALERT_USERNAME }}
          LEAK_ALERT_PASSWORD: ${{ secrets.LEAK_ALERT_PASSWORD }}
          API_HEALTH_OUTPUT: test-results/api-health.json
          API_HEALTH_NOTIFY_SUCCESS: "true"
        run: node scripts/check_api_health.js

      - name: Upload sanitized health results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-results
          path: test-results/api-health.json
          if-no-files-found: warn
          retention-days: 14
