url: https://dev-myportal.davao-water.gov.ph/gis/leak
name: REG-REPORT-006 Leak detail controlled values
tags:
  - regression
  - report
---
- runFlow:
    file: ../auth/01-login.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
      TEST_PASSWORD: ${TEST_PASSWORD}
- tapOn: "Create a Report"
- extendedWaitUntil:
    visible: "Report Details"
    timeout: 30000
- swipe:
    start: 800, 700
    end: 800, 400
    duration: 500
- tapOn:
    id: "reportType"
    index: 1
- tapOn: "Report A Leak"
- tapOn:
    id: "reporterType"
    index: 1
- tapOn: "Non Account Holder"
- swipe:
    start: 800, 700
    end: 800, 350
    duration: 500
- swipe:
    start: 800, 700
    end: 800, 350
    duration: 500
- tapOn:
    id: "typeId"
    index: 1
- takeScreenshot: screenshots/leak-type-options
