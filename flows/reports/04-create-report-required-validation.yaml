url: https://dev-myportal.davao-water.gov.ph/gis/leak
name: REG-REPORT-004 Reject incomplete report submission
tags:
  - regression
  - report
  - negative
  - critical
---
- runFlow:
    file: ../auth/01-login.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
      TEST_PASSWORD: ${TEST_PASSWORD}
- tapOn: "Create a Report"
- extendedWaitUntil:
    visible: "Report Details"
    timeout: 30000
- swipe:
    start: 800, 700
    end: 800, 400
    duration: 500
- tapOn: "^OK$"
- assertVisible: ".*TYPE OF REPORT.*"
- assertVisible: ".*ACCOUNT TYPE.*"
- assertVisible: ".*NAME.*"
- takeScreenshot: screenshots/create-report-required-validation
