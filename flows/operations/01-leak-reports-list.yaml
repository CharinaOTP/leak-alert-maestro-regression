- assertVisible: "Leak Type"
- assertVisible: "Location"
- assertVisible: "Remarks"
- assertVisible: "Date Reported"
- assertVisible: "Actions"
- assertVisible: "2026072C26"
- assertVisible: "Charina Mae Castillano"
- takeScreenshot: screenshots/operations-leak-reports-list
