url: https://dev-myportal.davao-water.gov.ph/gis/leak
name: REG-OPS-003 Report images and location tabs
tags:
  - regression
  - operations
  - map
  - attachments
---
- runFlow:
    file: 01-leak-reports-list.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
      TEST_PASSWORD: ${TEST_PASSWORD}
- tapOn:
    id: "file-search"
- extendedWaitUntil:
    visible: "Reference NO. 2026072C26"
    timeout: 30000
- tapOn: "Leak Images"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ".*Leak Images \\(Before Repair\\).*"
- assertVisible: "Leak Image 1"
- assertVisible: "Leak Image 2"
- assertVisible: "Landmark / Location Image"
- assertVisible: "No image available"
- takeScreenshot: screenshots/operations-leak-images
- tapOn: "Reported Location"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Map"
- assertVisible: "Satellite"
- takeScreenshot: screenshots/operations-reported-location
