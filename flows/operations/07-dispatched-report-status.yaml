url: https://dev-myportal.davao-water.gov.ph/gis/leak
name: REG-OPS-007 Dispatched report status persistence
tags:
  - regression
  - operations
  - dispatch
  - persistence
  - critical
---
- runFlow:
    file: 01-leak-reports-list.yaml
    env:
      TEST_USERNAME: ${TEST_USERNAME}
      TEST_PASSWORD: ${TEST_PASSWORD}
- eraseText: 10
- tapOn: "Customer Reports"
- tapOn: "Dispatched"
- tapOn: "Search..."
- inputText: "202607C949"
- extendedWaitUntil:
    visible: "202607C949"
    timeout: 30000
- assertVisible: "Charina Mae Castillano"
- takeScreenshot: screenshots/dispatched-report-persistence
